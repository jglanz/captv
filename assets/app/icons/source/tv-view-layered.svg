<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1254" height="1254" viewBox="0 0 1254 1254"
     role="img" aria-labelledby="title description">
  <title id="title">TV View — editable vector recreation</title>
  <desc id="description">A playful purple television with a colorful screen, white play symbol, and USB capture card. Twelve named vector layers. Recreated from the approved raster master; the original PNG remains the authoritative application artwork.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.85" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#4668ff"/>
      <stop offset="0.38" stop-color="#3437fa"/>
      <stop offset="0.78" stop-color="#3c1bd8"/>
      <stop offset="1" stop-color="#2517c4"/>
    </linearGradient>
    <radialGradient id="tile-light" cx="0.23" cy="0.04" r="0.8">
      <stop stop-color="#7391ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3423ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile-rim" x2="0" y2="1">
      <stop stop-color="#84a2ff" stop-opacity="0.8"/>
      <stop offset="0.17" stop-color="#5b78ff" stop-opacity="0.1"/>
      <stop offset="0.85" stop-color="#9170ff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#7a58ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="body" x1="0.18" y1="0" x2="0.74" y2="1">
      <stop stop-color="#8978e4"/>
      <stop offset="0.12" stop-color="#5548b5"/>
      <stop offset="0.33" stop-color="#332971"/>
      <stop offset="0.76" stop-color="#242052"/>
      <stop offset="1" stop-color="#17173d"/>
    </linearGradient>
    <linearGradient id="body-rim" x1="0.22" y1="0" x2="0.75" y2="1">
      <stop stop-color="#d5c6ff"/>
      <stop offset="0.18" stop-color="#8d7add"/>
      <stop offset="0.43" stop-color="#3d348c"/>
      <stop offset="0.8" stop-color="#29235f"/>
      <stop offset="1" stop-color="#6d57b8"/>
    </linearGradient>
    <linearGradient id="body-shine" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#f1dcff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#c7b8ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7668d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="1" y2="0.7">
      <stop stop-color="#8c76d7"/>
      <stop offset="0.22" stop-color="#5a45a1"/>
      <stop offset="0.7" stop-color="#31215f"/>
      <stop offset="1" stop-color="#171334"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#45207b"/>
      <stop offset="0.45" stop-color="#7950ce"/>
      <stop offset="0.7" stop-color="#a174ed"/>
      <stop offset="1" stop-color="#563298"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="0.85">
      <stop stop-color="#1ffff0"/>
      <stop offset="0.33" stop-color="#00bfff"/>
      <stop offset="0.62" stop-color="#2a42ff"/>
      <stop offset="1" stop-color="#9625f5"/>
    </linearGradient>
    <linearGradient id="blue-wave" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00c9f8"/>
      <stop offset="0.48" stop-color="#1264ff"/>
      <stop offset="1" stop-color="#a41df7"/>
    </linearGradient>
    <linearGradient id="violet-wave" x1="0" y1="0" x2="1" y2="0.4">
      <stop stop-color="#5433ff"/>
      <stop offset="0.45" stop-color="#a52cfa"/>
      <stop offset="1" stop-color="#f015c4"/>
    </linearGradient>
    <linearGradient id="coral-wave" x1="0.1" y1="0" x2="0.75" y2="0.8">
      <stop stop-color="#ee1de3"/>
      <stop offset="0.55" stop-color="#ff477b"/>
      <stop offset="1" stop-color="#ffad24"/>
    </linearGradient>
    <linearGradient id="gold-wave" x1="0" y1="0" x2="0.8" y2="0.7">
      <stop stop-color="#ff7763"/>
      <stop offset="0.6" stop-color="#ffc626"/>
      <stop offset="1" stop-color="#fff11a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.3" y2="1">
      <stop stop-color="#e4ffff" stop-opacity="0.9"/>
      <stop offset="0.43" stop-color="#baffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f2ff"/>
    </linearGradient>
    <linearGradient id="usb-metal" x1="0" y1="0" x2="1" y2="0.8">
      <stop stop-color="#fafaff"/>
      <stop offset="0.28" stop-color="#d6d8e5"/>
      <stop offset="0.6" stop-color="#bfc0d0"/>
      <stop offset="0.82" stop-color="#f5f2ff"/>
      <stop offset="1" stop-color="#77758e"/>
    </linearGradient>
    <linearGradient id="dongle" x1="0.25" y1="0" x2="0.5" y2="1">
      <stop stop-color="#8a73c5"/>
      <stop offset="0.18" stop-color="#645098"/>
      <stop offset="0.48" stop-color="#3a3066"/>
      <stop offset="0.8" stop-color="#292447"/>
      <stop offset="1" stop-color="#211b3d"/>
    </linearGradient>
    <linearGradient id="dongle-shine" x1="0" y1="0" x2="0.2" y2="1">
      <stop stop-color="#d2b8ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8b76c9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="status" x2="0" y2="1">
      <stop stop-color="#c1ffe5"/>
      <stop offset="0.5" stop-color="#6effbc"/>
      <stop offset="1" stop-color="#39e894"/>
    </linearGradient>
    <clipPath id="screen-clip">
      <path d="M342 267 C487 251 811 253 927 277 C1016 295 1048 343 1048 438 L1041 745 C1040 822 1020 851 947 863 C784 889 455 880 314 854 C219 837 175 801 173 711 L170 468 C169 334 206 282 342 267Z"/>
    </clipPath>
    <filter id="soft-shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="19"/>
    </filter>
    <filter id="status-glow" x="-100%" y="-150%" width="300%" height="400%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="play-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
