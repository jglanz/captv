  <g id="layer-tile" inkscape:groupmode="layer" inkscape:label="01 · Violet icon tile">
    <rect x="16" y="18" width="1220" height="1218" rx="230" fill="url(#tile)"/>
    <rect x="16" y="18" width="1220" height="1218" rx="230" fill="url(#tile-light)"/>
    <rect x="22" y="24" width="1208" height="1206" rx="225" fill="none" stroke="url(#tile-rim)" stroke-width="9"/>
  </g>
  <g id="layer-ground" inkscape:groupmode="layer" inkscape:label="02 · Ground shadows">
    <ellipse cx="616" cy="1010" rx="410" ry="43" fill="#100b56" opacity="0.55" filter="url(#soft-shadow)"/>
    <ellipse cx="790" cy="1166" rx="245" ry="29" fill="#130d4c" opacity="0.65" filter="url(#soft-shadow)"/>
  </g>
  <g id="layer-cable" inkscape:groupmode="layer" inkscape:label="03 · Capture cable">
    <path d="M1048 857 C1161 882 1167 943 1151 1006 C1130 1093 1071 1103 995 1079" fill="none" stroke="#24133d" stroke-width="82" stroke-linecap="round"/>
    <path d="M1048 850 C1161 875 1167 936 1151 999 C1130 1086 1071 1096 995 1072" fill="none" stroke="url(#cable)" stroke-width="70" stroke-linecap="round"/>
    <path d="M1056 837 C1152 864 1159 927 1143 985" fill="none" stroke="#bd8cff" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round"/>
    <rect x="981" y="1041" width="70" height="62" rx="22" fill="url(#cable)"/>
  </g>
  <g id="layer-feet" inkscape:groupmode="layer" inkscape:label="04 · Television feet">
    <path d="M250 898 L357 922 L313 1012 Q302 1036 268 1030 L237 1027 Q207 1025 221 993Z" fill="url(#foot)" stroke="#7057b0" stroke-width="3"/>
    <path d="M817 919 L912 900 L953 992 Q964 1020 932 1023 L897 1026 Q874 1027 862 1006Z" fill="url(#foot)"/>
    <path d="M247 930 L229 993 Q219 1015 248 1017" fill="none" stroke="#bd9cf8" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g id="layer-tv" inkscape:groupmode="layer" inkscape:label="05 · Television frame">
    <path d="M355 183 C497 169 836 170 961 192 C1081 213 1115 302 1122 419 L1111 768 C1106 872 1075 924 995 944 C858 976 350 968 232 941 C144 922 107 841 106 717 L110 442 C111 276 177 197 355 183Z" fill="url(#body)" stroke="url(#body-rim)" stroke-width="12"/>
    <path d="M350 243 C504 224 826 226 945 251 C1041 271 1081 327 1082 434 L1073 759 C1071 847 1044 882 963 896 C808 924 434 912 298 887 C197 868 150 820 148 715 L146 457 C146 315 197 261 350 243Z" fill="#10132e" stroke="#3d3881" stroke-width="8"/>
    <path d="M149 369 C162 258 213 218 351 203 C516 183 802 185 937 207" fill="none" stroke="url(#body-shine)" stroke-width="22" stroke-linecap="round"/>
    <path d="M169 826 C195 901 272 924 395 930 C614 947 847 947 978 925" fill="none" stroke="#aa81f4" stroke-opacity="0.19" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g id="layer-screen" inkscape:groupmode="layer" inkscape:label="06 · Cyan and blue screen" clip-path="url(#screen-clip)">
    <rect x="165" y="250" width="890" height="640" fill="url(#screen)"/>
    <path d="M140 496 C304 446 444 489 579 426 C713 367 782 267 980 265 L1090 270 L1090 900 L140 900Z" fill="url(#blue-wave)"/>
  </g>
  <g id="layer-waves" inkscape:groupmode="layer" inkscape:label="07 · Violet coral and gold waves" clip-path="url(#screen-clip)">
    <path d="M139 747 C296 626 399 655 532 626 C754 578 838 430 1086 417 L1086 904 L139 904Z" fill="url(#violet-wave)"/>
    <path d="M140 858 C269 763 354 744 492 732 C760 709 866 583 1084 548 L1084 903 L140 903Z" fill="url(#coral-wave)"/>
    <path d="M349 893 C492 825 658 811 788 752 C900 702 978 676 1080 672 L1080 901Z" fill="url(#gold-wave)"/>
    <path d="M667 895 C799 813 906 770 1054 753 L1054 900Z" fill="#fff316" opacity="0.75"/>
  </g>
  <g id="layer-glass" inkscape:groupmode="layer" inkscape:label="08 · Screen glass reflection" clip-path="url(#screen-clip)">
    <path d="M183 459 C170 348 220 294 350 284 C498 271 673 278 777 278 C524 307 291 316 183 459Z" fill="url(#glass)"/>
    <path d="M191 394 C198 322 245 295 342 284" fill="none" stroke="#e2ffff" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g id="layer-play" inkscape:groupmode="layer" inkscape:label="09 · White play symbol">
    <path d="M479 458 Q477 412 515 432 L731 551 Q771 574 732 598 L521 718 Q481 743 479 696Z" fill="#6733a2" opacity="0.22" filter="url(#play-shadow)"/>
    <path d="M479 444 Q477 398 515 418 L731 537 Q771 560 732 584 L521 704 Q481 729 479 682Z" fill="url(#play)"/>
  </g>
  <g id="layer-usb" inkscape:groupmode="layer" inkscape:label="10 · USB connector">
    <path d="M524 1026 L620 1026 L620 1135 L524 1135Z" fill="url(#usb-metal)" stroke="#b5b0d1" stroke-width="4"/>
    <path d="M524 1121 L620 1121 L620 1135 L524 1135Z" fill="#706b91" opacity="0.55"/>
    <rect x="559" y="1037" width="22" height="20" rx="2" fill="#4f4b63" stroke="#f0eaff" stroke-width="2"/>
    <rect x="559" y="1078" width="22" height="20" rx="2" fill="#4f4b63" stroke="#f0eaff" stroke-width="2"/>
    <path d="M530 1032 V1115" stroke="#ffffff" stroke-opacity="0.8" stroke-width="4"/>
  </g>
  <g id="layer-dongle" inkscape:groupmode="layer" inkscape:label="11 · Capture card enclosure">
    <path d="M689 988 L928 992 Q1002 992 1010 1058 L1014 1106 Q1018 1163 950 1169 L690 1171 Q614 1171 613 1107 L613 1047 Q614 988 689 988Z" fill="url(#dongle)" stroke="#5d478b" stroke-width="3"/>
    <path d="M637 1033 Q642 1006 694 1006 L924 1009 Q976 1010 988 1044" fill="none" stroke="url(#dongle-shine)" stroke-width="14" stroke-linecap="round"/>
    <path d="M644 1144 Q666 1159 708 1159 L946 1156 Q983 1154 996 1132" fill="none" stroke="#8670bd" stroke-opacity="0.2" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g id="layer-status" inkscape:groupmode="layer" inkscape:label="12 · Mint status light">
    <rect x="867" y="1063" width="66" height="30" rx="15" fill="#53ffb5" opacity="0.8" filter="url(#status-glow)"/>
    <rect x="872" y="1067" width="56" height="23" rx="11.5" fill="url(#status)"/>
    <path d="M883 1071 H915" stroke="#e4ffef" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
